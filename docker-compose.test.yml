# Проверка без внешних зависимостей: docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
services:
  tests:
    build:
      context: .
      target: test
    environment:
      GATEWAY_URL: http://gateway:8000
      TEST_REDIS_URL: redis://redis:6379/0
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      target: production
    environment:
      UPSTREAM_RECIPES_URL: http://recipes:8000
      UPSTREAM_DICTIONARY_URL: http://dictionary:8000
      UPSTREAM_USER_URL: http://user:8000
      REDIS_URL: redis://redis:6379/0
      # Одноразовый ключ только для этого тестового контейнера.
      JWT_PRIVATE_KEY_FILE: /tmp/jwt-private.pem
      # Smoke-тесты шлют много запросов подряд и не проверяют лимит.
      RATE_LIMIT_ENABLED: "false"
    # Ключ создаётся при старте контейнера, потом запускается команда из `command`
    # (держать в синхроне с CMD в Dockerfile; compose сбрасывает CMD образа при
    # своём entrypoint). Отдельный one-shot сервис не годится: с
    # --abort-on-container-exit compose после тестов зависает на остановке.
    entrypoint:
      - sh
      - -c
      - |
        python - <<'PY'
        import os
        from cryptography.hazmat.primitives import serialization as s
        from cryptography.hazmat.primitives.asymmetric import ec
        key = ec.generate_private_key(ec.SECP256R1())
        pem = key.private_bytes(s.Encoding.PEM, s.PrivateFormat.PKCS8, s.NoEncryption())
        fd = os.open("/tmp/jwt-private.pem", os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o400)
        with os.fdopen(fd, "wb") as file:
            file.write(pem)
        PY
        exec "$@"
      - --
    command:
      - uvicorn
      - gateway.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
      - --no-server-header
      - --no-proxy-headers
    depends_on:
      recipes:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Заглушка MS-3: регистрация, вход и профиль для сквозной проверки logout.
  user:
    build:
      context: .
      target: test
    command: ["uvicorn", "tests.stubs.user_stub:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  recipes:
    build:
      context: .
      target: test
    command: ["uvicorn", "tests.stubs.recipes_stub:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 20
